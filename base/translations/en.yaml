configuration:
  mesh_serial:
    name: Meshtastic node (USB)
    description: >-
      The base station's Meshtastic node, if it is plugged into this machine by USB.
      Leave empty if you use the network address below instead.
  mesh_host:
    name: Meshtastic node (network)
    description: >-
      IP address or host name of the base station's Meshtastic node on Wi-Fi or Ethernet
      (port 4403). Used when no USB device is set.
  firmware_repo:
    name: Firmware repository
    description: >-
      GitHub repository (owner/name) to download collar firmware from and build it from.
      Leave empty for the official one.
  ota_subnet:
    name: Network to search for collars being updated
    description: >-
      For Wi-Fi updates, the network the collar joins, such as 192.168.1.0/24. Leave empty to
      use this machine's own network.
  home:
    name: Home location
    description: >-
      Where the map starts, as "latitude, longitude". Leave empty to use Home Assistant's own
      home location (Settings > System > General).
network:
  8099/tcp: Web page without Home Assistant login. Leave empty unless you need it.
