name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware-host-tests:
    name: Firmware logic tests (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C firmware/test

  base-tests:
    name: Base app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r base/requirements-dev.txt
      - run: python -m pytest -q base/tests
        env:
          PYTHONPATH: base

  firmware-build:
    name: Firmware build (Heltec Wireless Tracker)
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the firmware-latest release
    concurrency:
      group: firmware-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/MESHTASTIC_VERSION') }}
      # Meshtastic 2.8 pins this version; newer post-releases are rejected by its ESP32 platform.
      - run: pip install platformio==6.2.0
      - run: firmware/build.sh heltec-wireless-tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for the Meshtastic release lookup
      - run: firmware/package.py dist heltec-wireless-tracker
      - uses: actions/upload-artifact@v4
        with:
          name: geocollar-heltec-wireless-tracker
          path: dist/
          if-no-files-found: error
      # Each build of main replaces the files on the "firmware-latest" pre-release, which the base
      # app downloads from (Firmware > Download latest build). manifest.json goes last, so a
      # download that catches the upload halfway sees old hashes and simply retries.
      - name: Publish to the firmware-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view firmware-latest >/dev/null 2>&1 || gh release create firmware-latest --prerelease \
            --title "Latest collar firmware" --notes "Built automatically from main. The base app downloads it from here."
          gh release upload firmware-latest dist/*.bin --clobber
          gh release upload firmware-latest dist/manifest.json --clobber
          gh release edit firmware-latest --notes "Built automatically from main at ${GITHUB_SHA}. The base app downloads it from here."

  base-image:
    name: Base app image (amd64 + arm64) and Home Assistant app lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./base"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: base
          platforms: linux/amd64,linux/arm64
          push: false
